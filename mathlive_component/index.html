<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MathLive Streamlit Component</title>
    <!-- Nhúng MathLive từ CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/mathlive"></script>
</head>
<body>
    <!-- Thẻ math-field với chế độ tự động bật bàn phím ảo -->
    <math-field id="math-field" virtual-keyboard-mode="auto">
        f(x) = 
    </math-field>

    <script>
        const mf = document.getElementById('math-field');

        // Lắng nghe sự kiện thay đổi dữ liệu khi người dùng gõ hoặc bấm bàn phím ảo
        mf.addEventListener('input', (ev) => {
            const latexValue = mf.value;
            
            // Gửi dữ liệu LaTeX về cho Streamlit Python app nhận diện
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: 'streamlit:setComponentValue',
                value: latexValue
            }, '*');
        });

        // Thiết lập kích thước component cho Streamlit tự động co giãn
        const sendHeight = () => {
            const height = document.body.scrollHeight;
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: 'streamlit:frameHeight',
                height: height
            }, '*');
        };
        
        window.addEventListener('load', sendHeight);
        mf.addEventListener('input', sendHeight);
    </script>
</body>
</html>
