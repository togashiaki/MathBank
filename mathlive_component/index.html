<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Nhúng MathLive ES Module & Streamlit Component API -->
    <script type="module" src="https://unpkg.com/mathlive?module"></script>
    <script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@1.3.0/dist/streamlit.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');
        
        :root {
            --keyboard-zindex: 99999999 !important;
        }

        * { box-sizing: border-box; }
        html, body { 
            margin: 0; padding: 2px; 
            background-color: transparent; 
            color: #2c2825; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            width: 100%;
        }

        /* KHUNG CHỨA VĂN BẢN TRÊN TRANG CHÍNH */
        .editor-container { 
            background-color: #faf8f5; 
            border: 1px solid #e2dbd0; 
            border-radius: 12px; 
            padding: 10px 14px; 
            line-height: 1.8; 
            box-shadow: 0 1px 4px rgba(44,40,37,0.03); 
            outline: none; 
            width: 100%;
            min-height: 56px;
            word-wrap: break-word;
        }
        .plain-text { outline: none; display: inline; color: #2c2825; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; }
        
        /* CHIP CÔNG THỨC ĐỎ */
        math-field.inline-math-chip { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            vertical-align: middle; 
            background-color: #faf0ec !important; 
            border: 1.5px solid #e8c4b8 !important; 
            color: #a8412c !important; 
            border-radius: 10px !important; 
            padding: 2px 8px !important; 
            margin: 2px 4px !important; 
            font-size: 0.98rem !important; 
            outline: none !important; 
            box-shadow: 0 2px 6px rgba(184, 84, 63, 0.08); 
            cursor: pointer; 
            user-select: all;
            transition: all 0.15s ease;
        }
        math-field.inline-math-chip:hover { 
            background-color: #f5e2db !important;
            border-color: #b8543f !important; 
            box-shadow: 0 4px 12px rgba(184, 84, 63, 0.18);
        }

        /* BÀN PHÍM ẢO CỐ ĐỊNH Ở ĐÁY KHUNG IFRAME */
        math-virtual-keyboard, 
        .ML__keyboard, 
        div[data-ml-keyboard] { 
            z-index: 99999999 !important; 
            --keyboard-zindex: 99999999 !important; 
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100% !important;
        }

        /* POPUP MODAL MỜ NẰM TRONG KHUNG IFRAME ĐƯỢC GIÃN RỘNG */
        .modal-overlay {
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 40, 37, 0.55); 
            backdrop-filter: blur(4px);
            z-index: 10000; 
            justify-content: center; 
            align-items: flex-start;
            padding-top: 15px;
            padding-bottom: 300px;
            overflow-y: auto;
        }

        .modal-content {
            background: #ffffff; 
            width: 95%; 
            max-width: 620px; 
            border-radius: 20px; 
            padding: 20px 24px;
            box-shadow: 0 16px 40px rgba(44, 40, 37, 0.28); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            position: relative; 
            border: 1px solid #e8c4b8;
            animation: popIn 0.22s ease-out;
            margin-bottom: 20px;
        }
        @keyframes popIn { 
            0% { opacity: 0; transform: scale(0.96) translateY(8px); }
            100% { opacity: 1; transform: scale(1) translateY(0px); }
        }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .modal-title { font-size: 1.2rem; font-weight: 700; color: #2c2825; }
        .close-btn { 
            background: #f0ebe1; border: none; border-radius: 50%; width: 32px; height: 32px; 
            cursor: pointer; font-weight: bold; color: #6b635b; display: flex; align-items: center; justify-content: center;
        }
        .close-btn:hover { background: #e8c4b8; color: #b8543f; }
        
        .form-group { margin-bottom: 14px; }
        .form-label { 
            font-size: 0.78rem; font-weight: 800; color: #b8543f !important; 
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; 
            display: flex; justify-content: space-between; align-items: center;
            min-height: 26px;
        }
        
        .inline-check { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 4px 0; margin-bottom: 10px; font-size: 0.9rem; color: #2c2825; font-weight: 600; 
        }
        .inline-check input[type="checkbox"] { accent-color: #b8543f !important; width: 18px; height: 18px; cursor: pointer; }
        
        math-field.modal-mf { 
            width: 100%; min-height: 58px; font-size: 1.2rem; 
            border: 2px solid #b8543f !important; border-radius: 12px !important; 
            padding: 8px 12px; background: #ffffff !important; outline: none !important; 
            box-shadow: 0 0 0 4px rgba(184, 84, 63, 0.12);
        }
        
        textarea.latex-area { 
            width: 100%; height: 58px; border: 1.5px solid #e8c4b8; border-radius: 12px; 
            padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 0.88rem; 
            background: #faf0ec; color: #2c2825; resize: vertical; outline: none;
        }
        
        .preview-box { 
            border: 1.5px dashed #b8543f; background: #faf8f5; border-radius: 12px; 
            padding: 10px; text-align: center; min-height: 48px; font-size: 1.05rem; 
            display: flex; justify-content: center; align-items: center;
        }
        
        .modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 18px; }
        .btn-cancel { background: #f0ebe1; color: #57524e; border: 1px solid #d8cfc4; border-radius: 10px; padding: 8px 18px; font-weight: 600; cursor: pointer; font-size: 0.88rem; }
        .btn-save { background: #b8543f !important; color: #ffffff !important; border: none; border-radius: 10px; padding: 8px 20px; font-weight: 600; cursor: pointer; font-size: 0.88rem; box-shadow: 0 3px 10px rgba(184, 84, 63, 0.25); }
        .btn-save:hover { background: #a34834 !important; }
        
        .btn-kb-toggle { background: #faf0ec; color: #b8543f !important; border: 1px solid #e8c4b8 !important; border-radius: 12px; padding: 4px 10px; font-size: 0.75rem; font-weight: 800; cursor: pointer; transition: all 0.2s; }
        .btn-kb-toggle:hover { background: #b8543f !important; color: #ffffff !important; }
    </style>
</head>
<body>
    <div id="editor" class="editor-container" contenteditable="true"></div>

    <!-- POPUP MODAL BIÊN SOẠN CÔNG THỨC -->
    <div id="mathModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Sửa công thức</div>
                <button class="close-btn" id="btnCloseModal">✕</button>
            </div>
            
            <div class="inline-check">
                <span>Hiển thị cùng dòng</span>
                <input type="checkbox" id="chkInline" checked>
            </div>
            
            <div class="form-group">
                <div class="form-label">
                    <span>NHẬP TRỰC QUAN BẰNG MATHLIVE</span>
                    <button class="btn-kb-toggle" id="btnToggleKb">Mở bàn phím Toán</button>
                </div>
                <math-field id="modalMathField" class="modal-mf" math-virtual-keyboard-policy="manual"></math-field>
            </div>
            
            <div class="form-group">
                <div class="form-label">LATEX TỰ ĐỘNG</div>
                <textarea id="txtLatex" class="latex-area"></textarea>
            </div>
            
            <div class="form-group">
                <div class="form-label">XEM TRƯỚC MATHJAX</div>
                <div class="preview-box">
                    <math-field id="previewMathField" read-only style="border:none; background:transparent; display:inline-block;"></math-field>
                </div>
            </div>
            
            <div class="modal-footer">
                <button class="btn-cancel" id="btnCancelModal">Huỷ</button>
                <button class="btn-save" id="btnSaveModal">Lưu công thức</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { MathfieldElement } from 'https://unpkg.com/mathlive?module';

        let currentText = "";
        let isUserEditing = false;
        let activeTargetMf = null;
        let currentHeightMode = "compact";

        function sendToStreamlit(type, data) {
            window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
        }

        function setIframeHeight(height) {
            if (window.Streamlit) {
                Streamlit.setFrameHeight(height);
            } else {
                sendToStreamlit("streamlit:setFrameHeight", { height: height });
            }
        }

        function getFullText() {
            const container = document.getElementById('editor');
            if (!container) return "";
            let fullText = "";
            container.childNodes.forEach(node => {
                if (node.nodeName && node.nodeName.toLowerCase() === 'math-field') { 
                    fullText += '$' + node.value + '$'; 
                }
                else if (node.nodeType === Node.ELEMENT_NODE) { fullText += node.innerText; }
                else if (node.nodeType === Node.TEXT_NODE) { fullText += node.textContent; }
            });
            return fullText;
        }

        function syncHeightOnly() {
            let editorElem = document.getElementById('editor');
            let targetHeight = (currentHeightMode === "large") ? 380 : Math.max(65, (editorElem ? editorElem.scrollHeight + 20 : 65));
            setIframeHeight(targetHeight);
        }

        function syncWithStreamlit() { 
            currentText = getFullText(); 
            if (window.Streamlit) {
                Streamlit.setComponentValue(currentText);
            } else {
                sendToStreamlit("streamlit:setComponentValue", { value: currentText });
            }
            syncHeightOnly(); 
        }

        const modal = document.getElementById('mathModal');
        const modalMf = document.getElementById('modalMathField');
        const txtLatex = document.getElementById('txtLatex');
        const prevMf = document.getElementById('previewMathField');

        /* HÀM BẮT BUỘC ÉP MATHLIVE HIỂN THỊ BÀN PHÍM ẢO TRÊN MÁY TÍNH */
        function forceShowVirtualKeyboard() {
            if (window.mathVirtualKeyboard) {
                window.mathVirtualKeyboard.layouts = ["numeric", "symbols", "greek", "alphabetic"];
                window.mathVirtualKeyboard.container = document.body;
                window.mathVirtualKeyboard.target = modalMf;
                window.mathVirtualKeyboard.visible = true; // ÉP HIỂN THỊ TRÊN DESKTOP
            }
        }

        modalMf.addEventListener("focusin", () => {
            forceShowVirtualKeyboard();
        });

        window.openMathModal = function(mf) {
            activeTargetMf = mf;
            modalMf.value = mf.value;
            txtLatex.value = mf.value;
            prevMf.value = mf.value;

            // 1. Dùng API chính chủ của Streamlit giãn rộng Iframe lên 720px
            setIframeHeight(720);

            // 2. Mở Modal
            modal.style.display = 'flex';

            // 3. Focus và Bật bàn phím
            setTimeout(() => {
                modalMf.focus();
                forceShowVirtualKeyboard();
            }, 100);
        };

        window.closeMathModal = function() {
            modal.style.display = 'none';
            activeTargetMf = null;

            if (window.mathVirtualKeyboard) {
                window.mathVirtualKeyboard.visible = false;
            }

            // Thu nhỏ Iframe về kích thước cũ
            syncHeightOnly();
        };

        window.saveMathModal = function() {
            if (activeTargetMf) {
                activeTargetMf.value = modalMf.value;
                syncWithStreamlit();
            }
            window.closeMathModal();
        };

        window.toggleModalKb = function() {
            modalMf.focus();
            if (window.mathVirtualKeyboard) {
                window.mathVirtualKeyboard.layouts = ["numeric", "symbols", "greek", "alphabetic"];
                window.mathVirtualKeyboard.container = document.body;
                window.mathVirtualKeyboard.target = modalMf;
                window.mathVirtualKeyboard.visible = !window.mathVirtualKeyboard.visible;
            }
        };

        document.getElementById('btnCloseModal').addEventListener('click', window.closeMathModal);
        document.getElementById('btnCancelModal').addEventListener('click', window.closeMathModal);
        document.getElementById('btnSaveModal').addEventListener('click', window.saveMathModal);
        document.getElementById('btnToggleKb').addEventListener('click', window.toggleModalKb);

        modalMf.addEventListener('input', () => {
            txtLatex.value = modalMf.value;
            prevMf.value = modalMf.value;
        });

        txtLatex.addEventListener('input', () => {
            modalMf.value = txtLatex.value;
            prevMf.value = txtLatex.value;
        });

        function buildEditor(rawText) {
            const container = document.getElementById('editor');
            if (!container) return;
            container.innerHTML = "";
            
            if (!rawText) {
                const span = document.createElement('span'); 
                span.className = 'plain-text'; 
                span.contentEditable = "true"; 
                span.innerText = "";
                span.addEventListener('blur', () => { isUserEditing = false; syncWithStreamlit(); });
                span.addEventListener('focus', () => { isUserEditing = true; });
                span.addEventListener('input', syncHeightOnly);
                container.appendChild(span); 
                syncHeightOnly();
                return;
            }
            
            const tokens = rawText.split(/(\$\$.*?\$\$|\$.*?\$)/g);
            tokens.forEach((token) => {
                if (!token) return;
                if ((token.startsWith('$$') && token.endsWith('$$')) || (token.startsWith('$') && token.endsWith('$'))) {
                    const mf = document.createElement('math-field'); 
                    mf.className = 'inline-math-chip'; 
                    mf.value = token.slice(1, -1);
                    mf.mathVirtualKeyboardPolicy = "manual";
                    
                    mf.addEventListener('click', () => { window.openMathModal(mf); });
                    mf.addEventListener('change', syncWithStreamlit);
                    mf.addEventListener('blur', () => { isUserEditing = false; syncWithStreamlit(); });
                    mf.addEventListener('focus', () => { isUserEditing = true; });
                    container.appendChild(mf);
                } else {
                    const span = document.createElement('span'); 
                    span.className = 'plain-text'; 
                    span.contentEditable = "true"; 
                    span.innerText = token;
                    span.addEventListener('blur', () => { isUserEditing = false; syncWithStreamlit(); });
                    span.addEventListener('focus', () => { isUserEditing = true; });
                    span.addEventListener('input', syncHeightOnly);
                    container.appendChild(span);
                }
            });
            syncHeightOnly();
        }

        const container = document.getElementById('editor');
        if (container) {
            container.addEventListener('paste', function(e) {
                e.preventDefault();
                const pastedText = (e.clipboardData || window.clipboardData).getData('text/plain');
                const sel = window.getSelection();
                if (sel.rangeCount) { 
                    const range = sel.getRangeAt(0); 
                    range.deleteContents(); 
                    range.insertNode(document.createTextNode(pastedText)); 
                } else { 
                    container.appendChild(document.createTextNode(pastedText)); 
                }
                isUserEditing = false; 
                currentText = getFullText(); 
                buildEditor(currentText); 
                syncWithStreamlit();
            });
        }

        function onRender(event) {
            const args = event.detail ? event.detail.args : event.data.args;
            if (args) {
                if (args.height_mode) {
                    currentHeightMode = args.height_mode;
                }
                if (args.text !== undefined && !isUserEditing && args.text !== currentText) { 
                    currentText = args.text; 
                    buildEditor(args.text); 
                }
            }
        }

        if (window.Streamlit) {
            Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
            Streamlit.setComponentReady();
        }

        window.addEventListener("message", function(event) {
            if (event.data && event.data.type === "streamlit:render") {
                onRender(event);
            }
        });

        window.addEventListener('load', () => { 
            if (window.Streamlit) {
                Streamlit.setComponentReady();
            } else {
                sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
            }
            syncHeightOnly();
        });
    </script>
</body>
</html>
