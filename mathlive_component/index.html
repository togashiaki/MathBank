<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- NHÚNG MATHLIVE & STREAMLIT COMPONENT LIB -->
    <script src="https://unpkg.com/mathlive"></script>
    <script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@1.3.0/dist/streamlit.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 2px;
            background-color: transparent;
            color: #2c2825;
            font-family: 'Plus Jakarta Sans', sans-serif;
            width: 100%;
            overflow-x: hidden;
        }

        /* MAIN EDITOR */
        .editor-container {
            background-color: #faf8f5;
            border: 1px solid #e2dbd0;
            border-radius: 12px;
            padding: 12px 16px;
            line-height: 1.8;
            box-shadow: 0 1px 4px rgba(44, 40, 37, 0.03);
            outline: none;
            width: 100%;
            min-height: 56px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            box-sizing: border-box;
        }

        /* THANH TRƯỢT BO TRÒN TỐI GIẢN TƯƠNG TỰ ẢNH MẪU */
        .editor-container::-webkit-scrollbar {
            width: 6px;
        }
        .editor-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .editor-container::-webkit-scrollbar-thumb {
            background: #d0d5dd;
            border-radius: 999px;
        }
        .editor-container::-webkit-scrollbar-thumb:hover {
            background: #b8543f;
        }

        .plain-text {
            outline: none;
            display: inline;
            color: #2c2825;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* INLINE MATH CHIP */
        math-field.inline-math-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;

            background-color: #faf0ec !important;
            border: 1.5px solid #e8c4b8 !important;
            color: #a8412c !important;

            border-radius: 10px !important;
            padding: 2px 8px !important;
            margin: 2px 4px !important;

            font-size: 0.98rem !important;

            outline: none !important;
            box-shadow: 0 2px 6px rgba(184, 84, 63, 0.08);

            cursor: pointer;
            user-select: none;

            transition: all 0.15s ease;
        }

        math-field.inline-math-chip:hover {
            background-color: #f5e2db !important;
            border-color: #b8543f !important;
            box-shadow: 0 4px 12px rgba(184, 84, 63, 0.18);
        }

        :root {
            --keyboard-zindex: 2147483647 !important;
        }

        math-virtual-keyboard, 
        .ML__keyboard, 
        div[data-ml-keyboard] {
            z-index: 2147483647 !important;
            --keyboard-zindex: 2147483647 !important;
        }

        /* MODAL PORTAL FULLSCREEN */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;

            background: rgba(44, 40, 37, 0.55);
            backdrop-filter: blur(4px);

            z-index: 10000;

            justify-content: center;
            align-items: flex-start;

            padding: 30px 12px 30px;
            overflow-y: auto;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-content {
            background: #ffffff;
            width: 90%;
            max-width: 620px;
            border-radius: 20px;
            padding: 22px 26px;
            box-shadow: 0 16px 40px rgba(44, 40, 37, 0.28);
            font-family: 'Plus Jakarta Sans', sans-serif;
            position: relative;
            border: 1px solid #e8c4b8;
            animation: popIn 0.22s ease-out;
            margin-bottom: var(--keyboard-height, 350px);
            transition: margin-bottom 0.15s ease;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.96) translateY(8px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2c2825;
        }

        .close-btn {
            background: #f0ebe1;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-weight: bold;
            color: #6b635b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: #e8c4b8;
            color: #b8543f;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            font-size: 0.8rem;
            font-weight: 800;
            color: #b8543f !important;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 28px;
        }

        .inline-check {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            margin-bottom: 12px;
            font-size: 0.92rem;
            color: #2c2825;
            font-weight: 600;
        }

        .inline-check input[type="checkbox"] {
            accent-color: #b8543f !important;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        math-field.modal-mf {
            width: 100%;
            min-height: 60px;
            font-size: 1.2rem;
            border: 2px solid #b8543f !important;
            border-radius: 12px !important;
            padding: 10px 14px;
            background: #ffffff !important;
            outline: none !important;
            box-shadow: 0 0 0 4px rgba(184, 84, 63, 0.12);
            --hue: 10;
        }

        math-field.modal-mf:focus {
            border-color: #a34834 !important;
        }

        textarea.latex-area {
            width: 100%;
            height: 65px;
            border: 1.5px solid #e8c4b8;
            border-radius: 12px;
            padding: 10px 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            background: #faf0ec;
            color: #2c2825;
            resize: vertical;
            outline: none;
        }

        textarea.latex-area:focus {
            border-color: #b8543f;
            box-shadow: 0 0 0 3px rgba(184, 84, 63, 0.10);
        }

        .preview-box {
            border: 1.5px dashed #b8543f;
            background: #faf8f5;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            min-height: 52px;
            font-size: 1.1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: auto;
        }

        math-field.preview-mf {
            border: none !important;
            background: transparent !important;
            display: inline-block;
            min-width: 20px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 22px;
        }

        .btn-cancel {
            background: #f0ebe1;
            color: #57524e;
            border: 1px solid #d8cfc4;
            border-radius: 10px;
            padding: 9px 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-cancel:hover {
            background: #e7dfd4;
        }

        .btn-save {
            background: #b8543f !important;
            color: #ffffff !important;
            border: none;
            border-radius: 10px;
            padding: 9px 22px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 3px 10px rgba(184, 84, 63, 0.25);
        }

        .btn-save:hover {
            background: #a34834 !important;
        }

        .btn-kb-toggle {
            background: #faf0ec;
            color: #b8543f !important;
            border: 1px solid #e8c4b8 !important;
            border-radius: 12px;
            padding: 5px 12px;
            font-size: 0.78rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-kb-toggle:hover {
            background: #b8543f !important;
            color: #ffffff !important;
        }
    </style>
</head>

<body>

    <!-- MAIN EDITOR -->
    <div id="editor" class="editor-container" contenteditable="true" spellcheck="false"></div>

    <!-- MATH EDITOR MODAL -->
    <div id="mathModal" class="modal-overlay" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="mathModalTitle">
            <div class="modal-header">
                <div id="mathModalTitle" class="modal-title">Sửa công thức</div>
                <button id="closeBtn" class="close-btn" type="button" aria-label="Đóng">✕</button>
            </div>

            <div class="inline-check">
                <span>Hiển thị cùng dòng</span>
                <input type="checkbox" id="chkInline" checked>
            </div>

            <div class="form-group">
                <div class="form-label">
                    <span>NHẬP TRỰC QUAN BẰNG MATHLIVE</span>
                    <button id="kbToggle" class="btn-kb-toggle" type="button">Mở bàn phím Toán</button>
                </div>
                <math-field id="modalMathField" class="modal-mf" math-virtual-keyboard-policy="sandboxed" smart-fence="on" smart-superscript="on"></math-field>
            </div>

            <div class="form-group">
                <div class="form-label">LATEX TỰ ĐỘNG</div>
                <textarea id="txtLatex" class="latex-area" spellcheck="false" autocomplete="off"></textarea>
            </div>

            <div class="form-group">
                <div class="form-label">XEM TRƯỚC</div>
                <div class="preview-box">
                    <math-field id="previewMathField" class="preview-mf" read-only></math-field>
                </div>
            </div>

            <div class="modal-footer">
                <button id="cancelBtn" class="btn-cancel" type="button">Huỷ</button>
                <button id="saveBtn" class="btn-save" type="button">Lưu công thức</button>
            </div>
        </div>
    </div>

    <script>
        let currentText = "";
        let isUserEditing = false;
        let activeTargetMf = null;
        let currentHeightMode = "compact";
        let suppressMathSync = false;
        let keyboardHeight = 0;

        function sendToStreamlit(type, data) {
            window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
        }

        function makeIframeFullscreen(enable) {
            try {
                let frame = window.frameElement;
                if (!frame && window.parent && window.parent.document) {
                    const iframes = window.parent.document.querySelectorAll('iframe');
                    for (let i = 0; i < iframes.length; i++) {
                        if (iframes[i].contentWindow === window) {
                            frame = iframes[i];
                            break;
                        }
                    }
                }
                if (frame) {
                    if (enable) {
                        frame.style.setProperty('position', 'fixed', 'important');
                        frame.style.setProperty('top', '0px', 'important');
                        frame.style.setProperty('left', '0px', 'important');
                        frame.style.setProperty('width', '100vw', 'important');
                        frame.style.setProperty('height', '100vh', 'important');
                        frame.style.setProperty('z-index', '999999', 'important');
                        frame.style.setProperty('background', 'transparent', 'important');
                    } else {
                        frame.style.removeProperty('position');
                        frame.style.removeProperty('top');
                        frame.style.removeProperty('left');
                        frame.style.removeProperty('width');
                        frame.style.removeProperty('height');
                        frame.style.removeProperty('z-index');
                        frame.style.removeProperty('background');
                    }
                }
            } catch(e) {}
        }

        function setIframeHeight(height) {
            const safeHeight = Math.max(65, Math.ceil(height));
            if (window.Streamlit) {
                Streamlit.setFrameHeight(safeHeight);
            } else {
                sendToStreamlit("streamlit:setFrameHeight", { height: safeHeight });
            }
        }

        function syncHeightOnly() {
            const editor = document.getElementById("editor");
            if (!editor) return;
            const modalOpen = document.getElementById("mathModal")?.classList.contains("open");
            if (modalOpen) return;

            /* XỬ LÝ KHUNG NHẬP LIỆU LỚN TẠI TAB 3 */
            if (currentHeightMode === "large") {
                editor.style.height = "520px";
                editor.style.maxHeight = "520px";
                editor.style.overflowY = "auto";
                setIframeHeight(540);
            } else {
                editor.style.height = "auto";
                editor.style.maxHeight = "none";
                editor.style.overflowY = "visible";
                const editorHeight = editor.scrollHeight + 20;
                setIframeHeight(Math.max(65, editorHeight));
            }
        }

        function getFullText() {
            const container = document.getElementById("editor");
            if (!container) return "";
            let fullText = "";
            container.childNodes.forEach((node) => {
                if (node.nodeType === Node.ELEMENT_NODE && node.nodeName.toLowerCase() === "math-field") {
                    fullText += "$" + node.value + "$";
                } else if (node.nodeType === Node.TEXT_NODE) {
                    fullText += node.textContent || "";
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    fullText += node.innerText || "";
                }
            });
            return fullText;
        }

        function syncWithStreamlit() {
            currentText = getFullText();
            if (window.Streamlit) {
                Streamlit.setComponentValue(currentText);
            } else {
                sendToStreamlit("streamlit:setComponentValue", { value: currentText });
            }
            syncHeightOnly();
        }

        const modal = document.getElementById("mathModal");
        const modalMf = document.getElementById("modalMathField");
        const txtLatex = document.getElementById("txtLatex");
        const prevMf = document.getElementById("previewMathField");
        const chkInline = document.getElementById("chkInline");

        async function waitForMathLive() {
            try {
                await customElements.whenDefined("math-field");
            } catch (error) {
                return false;
            }
            return true;
        }

        function configureMathfield(mf, options = {}) {
            if (!mf) return;
            const configure = () => {
                try {
                    if (options.readOnly !== undefined) mf.readOnly = options.readOnly;
                    mf.smartFence = true;
                    mf.mf = true;
                    mf.smartSuperscript = true;
                    if (options.keyboardPolicy) mf.mathVirtualKeyboardPolicy = options.keyboardPolicy;
                } catch (error) {}
            };
            if (mf.matches && mf.matches(":defined")) {
                configure();
            } else {
                mf.addEventListener("mount", configure, { once: true });
            }
        }

        function getVirtualKeyboard() {
            return window.mathVirtualKeyboard || null;
        }

        function configureVirtualKeyboard() {
            const kb = getVirtualKeyboard();
            if (!kb) return;
            try {
                kb.container = document.body;
            } catch (error) {}

            kb.addEventListener("geometrychange", (event) => {
                const rect = event.detail?.boundingRect;
                if (rect) {
                    keyboardHeight = Math.max(0, Math.ceil(rect.height));
                } else {
                    keyboardHeight = kb?.visible ? 300 : 0;
                }
                document.documentElement.style.setProperty("--keyboard-height", keyboardHeight + "px");
            });
        }

        function openMathModal(mf) {
            if (!mf) return;
            activeTargetMf = mf;
            modalMf.value = mf.value || "";
            txtLatex.value = mf.value || "";
            prevMf.value = mf.value || "";
            chkInline.checked = true;

            makeIframeFullscreen(true);

            modal.classList.add("open");
            modal.setAttribute("aria-hidden", "false");

            requestAnimationFrame(() => {
                setTimeout(() => {
                    modalMf.focus();
                }, 50);
            });
        }

        function closeMathModal() {
            const kb = getVirtualKeyboard();
            try {
                if (kb && kb.visible) kb.hide();
            } catch (error) {}

            keyboardHeight = 0;
            modal.classList.remove("open");
            modal.setAttribute("aria-hidden", "true");
            activeTargetMf = null;

            makeIframeFullscreen(false);
            syncHeightOnly();
        }

        function saveMathModal() {
            if (!activeTargetMf) {
                closeMathModal();
                return;
            }
            suppressMathSync = true;
            const latex = modalMf.value || "";
            activeTargetMf.value = latex;
            suppressMathSync = false;
            syncWithStreamlit();
            closeMathModal();
        }

        function toggleModalKb() {
            const kb = getVirtualKeyboard();
            if (!kb) return;
            modalMf.focus();
            try {
                if (kb.visible) {
                    kb.hide();
                } else {
                    kb.show();
                }
            } catch (error) {}
        }

        modalMf.addEventListener("input", () => {
            if (suppressMathSync) return;
            const latex = modalMf.value || "";
            txtLatex.value = latex;
            prevMf.value = latex;
        });

        txtLatex.addEventListener("input", () => {
            const latex = txtLatex.value;
            suppressMathSync = true;
            modalMf.value = latex;
            prevMf.value = latex;
            suppressMathSync = false;
        });

        document.getElementById("closeBtn").addEventListener("click", closeMathModal);
        document.getElementById("cancelBtn").addEventListener("click", closeMathModal);
        document.getElementById("saveBtn").addEventListener("click", saveMathModal);
        document.getElementById("kbToggle").addEventListener("click", toggleModalKb);

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && modal.classList.contains("open")) {
                closeMathModal();
            }
        });

        modal.addEventListener("mousedown", (event) => {
            if (event.target === modal) closeMathModal();
        });

        function createInlineMathfield(latex) {
            const mf = document.createElement("math-field");
            mf.className = "inline-math-chip";
            mf.readOnly = true;
            mf.mathVirtualKeyboardPolicy = "manual";
            mf.value = latex || "";
            configureMathfield(mf, { readOnly: true, keyboardPolicy: "manual" });

            mf.addEventListener("click", (event) => {
                event.preventDefault();
                openMathModal(mf);
            });
            mf.addEventListener("keydown", (event) => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    openMathModal(mf);
                }
            });
            return mf;
        }

        function createTextNode(text) {
            const span = document.createElement("span");
            span.className = "plain-text";
            span.contentEditable = "true";
            span.spellcheck = false;
            span.innerText = text || "";
            span.addEventListener("focus", () => { isUserEditing = true; });
            span.addEventListener("input", () => { isUserEditing = true; syncHeightOnly(); });
            span.addEventListener("blur", () => { isUserEditing = false; syncWithStreamlit(); });
            return span;
        }

        function parseTokens(rawText) {
            return rawText.split(/(\$\$[\s\S]*?\$\$|\$[\s\S]*?\$)/g);
        }

        function buildEditor(rawText) {
            const container = document.getElementById("editor");
            if (!container) return;
            if (isUserEditing && rawText !== currentText) return;

            currentText = rawText || "";
            while (container.firstChild) {
                container.removeChild(container.firstChild);
            }

            const tokens = parseTokens(currentText);
            let hasContent = false;
            tokens.forEach((token) => {
                if (!token) return;
                hasContent = true;
                const isDisplayMath = token.startsWith("$$") && token.endsWith("$$");
                const isInlineMath = token.startsWith("$") && token.endsWith("$");

                if (isDisplayMath || isInlineMath) {
                    const latex = isDisplayMath ? token.slice(2, -2) : token.slice(1, -1);
                    const mf = createInlineMathfield(latex);
                    container.appendChild(mf);
                } else {
                    container.appendChild(createTextNode(token));
                }
            });

            if (!hasContent) {
                container.appendChild(createTextNode(""));
            }
            syncHeightOnly();
        }

        const editorContainer = document.getElementById("editor");
        if (editorContainer) {
            editorContainer.addEventListener("paste", (event) => {
                const target = event.target;
                if (target && target.closest && target.closest("math-field")) return;
                event.preventDefault();
                const pastedText = (event.clipboardData || window.clipboardData).getData("text/plain");
                const selection = window.getSelection();
                if (selection && selection.rangeCount) {
                    const range = selection.getRangeAt(0);
                    if (editorContainer.contains(range.commonAncestorContainer)) {
                        range.deleteContents();
                        const textNode = document.createTextNode(pastedText);
                        range.insertNode(textNode);
                        range.setStartAfter(textNode);
                        range.collapse(true);
                    } else {
                        editorContainer.appendChild(document.createTextNode(pastedText));
                    }
                } else {
                    editorContainer.appendChild(document.createTextNode(pastedText));
                }
                isUserEditing = false;
                currentText = getFullText();
                buildEditor(currentText);
                syncWithStreamlit();
            });
        }

        function onRender(event) {
            try {
                const args = event?.detail?.args || event?.data?.args;
                if (!args) return;
                if (args.height_mode !== undefined) {
                    currentHeightMode = args.height_mode;
                }
                const modalOpen = modal.classList.contains("open");
                if (args.text !== undefined && !isUserEditing && !modalOpen && args.text !== currentText) {
                    currentText = args.text || "";
                    buildEditor(currentText);
                }
                syncHeightOnly();
            } catch (error) {}
        }

        async function initialize() {
            const ready = await waitForMathLive();
            if (!ready) return;

            configureMathfield(modalMf, { readOnly: false, keyboardPolicy: "sandboxed" });
            configureMathfield(prevMf, { readOnly: true, keyboardPolicy: "manual" });
            configureVirtualKeyboard();

            if (window.Streamlit) {
                Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
                Streamlit.setComponentReady();
            } else {
                sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
            }
            syncHeightOnly();
        }

        window.addEventListener("message", (event) => {
            if (event.data && event.data.type === "streamlit:render") {
                onRender(event);
            }
        });

        window.addEventListener("load", () => {
            initialize();
        });

        if (document.readyState === "complete") {
            initialize();
        }
    </script>
</body>
</html>
