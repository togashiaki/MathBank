>

            -->

<script>
    /*
     * =========================================================
     * MathBank MathLive Editor
     * =========================================================
     *
     * Architecture:
     *
     * Streamlit
     *     ↓
     * iframe
     *     ↓
     * text editor + read-only math chips
     *     ↓
     * modal
     *     ↓
     * editable MathLive field
     *     ↓
     * MathLive virtual keyboard
     *
     * The editable MathLive field is deliberately kept stable.
     * We do not recreate it on every Streamlit render.
     */


    let currentText = "";
    let isUserEditing = false;

    let activeTargetMf = null;

    let currentHeightMode = "compact";

    let editorInitialized = false;

    let suppressMathSync = false;

    let keyboardHeight = 0;


    /* =========================================================
       STREAMLIT COMMUNICATION
       ========================================================= */

    function sendToStreamlit(type, data) {
        window.parent.postMessage(
            Object.assign(
                {
                    isStreamlitMessage: true,
                    type: type
                },
                data
            ),
            "*"
        );
    }


    function setIframeHeight(height) {

        const safeHeight = Math.max(
            65,
            Math.ceil(height)
        );

        if (window.Streamlit) {

            Streamlit.setFrameHeight(
                safeHeight
            );

        } else {

            sendToStreamlit(
                "streamlit:setFrameHeight",
                {
                    height: safeHeight
                }
            );
        }
    }


    /* =========================================================
       EDITOR HEIGHT
       ========================================================= */

    function syncHeightOnly() {

        const editor =
            document.getElementById("editor");

        if (!editor) {
            return;
        }


        /*
         * The modal does not require the iframe itself to become
         * fullscreen.
         *
         * When the virtual keyboard is visible, MathLive reports
         * its geometry. We reserve enough iframe space for it.
         */

        const editorHeight =
            editor.scrollHeight + 20;


        const baseHeight =
            currentHeightMode === "large"
                ? 380
                : Math.max(
                    65,
                    editorHeight
                );


        const modalOpen =
            document
                .getElementById("mathModal")
                ?.classList
                .contains("open");


        if (modalOpen && keyboardHeight > 0) {

            setIframeHeight(
                Math.max(
                    baseHeight,
                    560 + keyboardHeight
                )
            );

        } else {

            setIframeHeight(
                baseHeight
            );
        }
    }


    /* =========================================================
       GET EDITOR VALUE
       ========================================================= */

    function getFullText() {

        const container =
            document.getElementById("editor");

        if (!container) {
            return "";
        }


        let fullText = "";


        container.childNodes.forEach(
            (node) => {

                if (
                    node.nodeType ===
                    Node.ELEMENT_NODE
                    &&
                    node.nodeName.toLowerCase() ===
                    "math-field"
                ) {

                    /*
                     * Store formulas using the same format as
                     * your existing application:
                     *
                     * $LATEX$
                     */

                    fullText +=
                        "$" +
                        node.value +
                        "$";

                }

                else if (
                    node.nodeType ===
                    Node.TEXT_NODE
                ) {

                    fullText +=
                        node.textContent || "";

                }

                else if (
                    node.nodeType ===
                    Node.ELEMENT_NODE
                ) {

                    fullText +=
                        node.innerText || "";
                }
            }
        );


        return fullText;
    }


    /* =========================================================
       SEND VALUE TO STREAMLIT
       ========================================================= */

    function syncWithStreamlit() {

        currentText =
            getFullText();


        if (window.Streamlit) {

            Streamlit.setComponentValue(
                currentText
            );

        } else {

            sendToStreamlit(
                "streamlit:setComponentValue",
                {
                    value: currentText
                }
            );
        }


        syncHeightOnly();
    }


    /* =========================================================
       MATHLIVE REFERENCES
       ========================================================= */

    const modal =
        document.getElementById(
            "mathModal"
        );

    const modalMf =
        document.getElementById(
            "modalMathField"
        );

    const txtLatex =
        document.getElementById(
            "txtLatex"
        );

    const prevMf =
        document.getElementById(
            "previewMathField"
        );

    const chkInline =
        document.getElementById(
            "chkInline"
        );


    /* =========================================================
       MATHLIVE READY
       ========================================================= */

    async function waitForMathLive() {

        try {

            await customElements.whenDefined(
                "math-field"
            );

        } catch (error) {

            console.error(
                "MathLive failed to initialize:",
                error
            );

            return false;
        }


        return true;
    }


    /* =========================================================
       CONFIGURE MATHFIELD
       ========================================================= */

    function configureMathfield(
        mf,
        options = {}
    ) {

        if (!mf) {
            return;
        }


        const configure = () => {

            try {

                if (
                    options.readOnly !==
                    undefined
                ) {

                    mf.readOnly =
                        options.readOnly;
                }


                /*
                 * Use properties rather than setOptions().
                 * This follows the MathLive API.
                 */

                mf.smartFence = true;

                mf.smartSuperscript = true;


                if (
                    options.keyboardPolicy
                ) {

                    mf.mathVirtualKeyboardPolicy =
                        options.keyboardPolicy;
                }


                /*
                 * Inline chips are not editors.
                 */

                if (
                    options.readOnly
                ) {

                    mf.tabIndex = 0;
                }

            } catch (error) {

                console.warn(
                    "MathLive configuration error:",
                    error
                );
            }
        };


        /*
         * MathLive recommends configuring the
         * MathfieldElement after mount.
         */

        if (
            mf.matches &&
            mf.matches(":defined")
        ) {

            configure();

        } else {

            mf.addEventListener(
                "mount",
                configure,
                {
                    once: true
                }
            );
        }
    }


    /* =========================================================
       VIRTUAL KEYBOARD
       ========================================================= */

    function getVirtualKeyboard() {

        return window.mathVirtualKeyboard || null;
    }


    function configureVirtualKeyboard() {

        const kb =
            getVirtualKeyboard();

        if (!kb) {
            return;
        }


        /*
         * Because this MathBank editor lives inside an iframe,
         * explicitly keep the keyboard in THIS browsing context.
         *
         * The API documents "container" as the element the
         * virtual keyboard is appended to.
         */

        try {

            kb.container =
                document.body;

        } catch (error) {

            console.warn(
                "Could not configure MathLive keyboard container:",
                error
            );
        }


        /*
         * React to keyboard geometry.
         *
         * This is much safer than manually setting:
         *
         * position: fixed
         * bottom: 0
         * width: 100vw
         */

        kb.addEventListener(
            "geometrychange",
            handleKeyboardGeometry
        );

        kb.addEventListener(
            "virtual-keyboard-toggle",
            handleKeyboardToggle
        );
    }


    function handleKeyboardGeometry(event) {

        const rect =
            event.detail?.boundingRect;


        if (rect) {

            keyboardHeight =
                Math.max(
                    0,
                    Math.ceil(
                        rect.height
                    )
                );

        } else {

            const kb =
                getVirtualKeyboard();

            keyboardHeight =
                kb?.visible
                    ? 300
                    : 0;
        }


        document.documentElement
            .style
            .setProperty(
                "--keyboard-height",
                keyboardHeight + "px"
            );


        syncHeightOnly();
    }


    function handleKeyboardToggle(event) {

        const visible =
            event.detail?.visible;


        if (!visible) {

            keyboardHeight = 0;

            document.documentElement
                .style
                .setProperty(
                    "--keyboard-height",
                    "20px"
                );

        }


        syncHeightOnly();
    }


    /* =========================================================
       OPEN MATH MODAL
       ========================================================= */

    function openMathModal(mf) {

        if (!mf) {
            return;
        }


        activeTargetMf = mf;


        /*
         * Copy current LaTeX into the editing field.
         */

        modalMf.value =
            mf.value || "";


        txtLatex.value =
            mf.value || "";


        prevMf.value =
            mf.value || "";


        /*
         * Preserve the inline/display checkbox.
         */

        chkInline.checked =
            true;


        /*
         * Open only the modal.
         *
         * IMPORTANT:
         * We do NOT modify the Streamlit iframe.
         */

        modal.classList.add(
            "open"
        );

        modal.setAttribute(
            "aria-hidden",
            "false"
        );


        /*
         * Wait for the modal to be visible before
         * focusing the mathfield.
         */

        requestAnimationFrame(
            () => {

                setTimeout(
                    () => {

                        modalMf.focus();

                        syncHeightOnly();

                    },
                    50
                );
            }
        );
    }


    /* =========================================================
       CLOSE MODAL
       ========================================================= */

    function closeMathModal() {

        const kb =
            getVirtualKeyboard();


        /*
         * Hide keyboard first.
         */

        try {

            if (
                kb &&
                kb.visible
            ) {

                kb.hide();
            }

        } catch (error) {

            console.warn(
                "Could not hide virtual keyboard:",
                error
            );
        }


        keyboardHeight = 0;


        modal.classList.remove(
            "open"
        );

        modal.setAttribute(
            "aria-hidden",
            "true"
        );


        activeTargetMf = null;


        /*
         * Return iframe to its natural Streamlit height.
         */

        syncHeightOnly();
    }


    /* =========================================================
       SAVE MATH
       ========================================================= */

    function saveMathModal() {

        if (!activeTargetMf) {

            closeMathModal();

            return;
        }


        suppressMathSync = true;


        /*
         * MathLive is the source of truth.
         */

        const latex =
            modalMf.value || "";


        activeTargetMf.value =
            latex;


        suppressMathSync = false;


        /*
         * Send updated editor contents to Streamlit.
         */

        syncWithStreamlit();


        closeMathModal();
    }


    /* =========================================================
       TOGGLE VIRTUAL KEYBOARD
       ========================================================= */

    function toggleModalKb() {

        const kb =
            getVirtualKeyboard();


        if (!kb) {

            console.warn(
                "MathLive virtual keyboard is not available."
            );

            return;
        }


        /*
         * Always restore focus to the editable mathfield.
         */

        modalMf.focus();


        try {

            if (kb.visible) {

                kb.hide();

            } else {

                /*
                 * Explicit show() is appropriate for the
                 * dedicated keyboard button.
                 */

                kb.show();
            }

        } catch (error) {

            console.error(
                "MathLive keyboard error:",
                error
            );
        }
    }


    /* =========================================================
       MODAL MATHLIVE INPUT
       ========================================================= */

    modalMf.addEventListener(
        "input",
        () => {

            if (suppressMathSync) {
                return;
            }


            const latex =
                modalMf.value || "";


            /*
             * MathLive → textarea
             */

            txtLatex.value =
                latex;


            /*
             * MathLive → preview
             */

            prevMf.value =
                latex;
        }
    );


    /* =========================================================
       LATEX TEXTAREA INPUT
       ========================================================= */

    txtLatex.addEventListener(
        "input",
        () => {

            const latex =
                txtLatex.value;


            suppressMathSync = true;


            /*
             * textarea → MathLive
             */

            modalMf.value =
                latex;


            /*
             * textarea → preview
             */

            prevMf.value =
                latex;


            suppressMathSync = false;
        }
    );


    /* =========================================================
       MODAL BUTTONS
       ========================================================= */

    document
        .getElementById("closeBtn")
        .addEventListener(
            "click",
            closeMathModal
        );


    document
        .getElementById("cancelBtn")
        .addEventListener(
            "click",
            closeMathModal
        );


    document
        .getElementById("saveBtn")
        .addEventListener(
            "click",
            saveMathModal
        );


    document
        .getElementById("kbToggle")
        .addEventListener(
            "click",
            toggleModalKb
        );


    /* =========================================================
       ESCAPE KEY
       ========================================================= */

    document.addEventListener(
        "keydown",
        (event) => {

            if (
                event.key === "Escape" &&
                modal.classList.contains("open")
            ) {

                closeMathModal();
            }
        }
    );


    /* =========================================================
       CLICK OUTSIDE MODAL
       ========================================================= */

    modal.addEventListener(
        "mousedown",
        (event) => {

            if (
                event.target === modal
            ) {

                closeMathModal();
            }
        }
    );


    /* =========================================================
       CREATE INLINE MATHFIELD
       ========================================================= */

    function createInlineMathfield(
        latex
    ) {

        const mf =
            document.createElement(
                "math-field"
            );


        mf.className =
            "inline-math-chip";


        /*
         * Inline formulas are display/edit triggers,
         * not active editors.
         */

        mf.readOnly = true;

        mf.mathVirtualKeyboardPolicy =
            "manual";


        mf.value =
            latex || "";


        configureMathfield(
            mf,
            {
                readOnly: true,
                keyboardPolicy: "manual"
            }
        );


        /*
         * Click opens the proper MathLive editor.
         */

        mf.addEventListener(
            "click",
            (event) => {

                event.preventDefault();

                openMathModal(mf);
            }
        );


        /*
         * Keyboard focus can also open the editor.
         * This makes the chip accessible.
         */

        mf.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    event.preventDefault();

                    openMathModal(mf);
                }
            }
        );


        return mf;
    }


    /* =========================================================
       CREATE TEXT NODE
       ========================================================= */

    function createTextNode(
        text
    ) {

        const span =
            document.createElement(
                "span"
            );


        span.className =
            "plain-text";


        span.contentEditable =
            "true";


        span.spellcheck =
            false;


        span.innerText =
            text || "";


        span.addEventListener(
            "focus",
            () => {

                isUserEditing =
                    true;
            }
        );


        span.addEventListener(
            "input",
            () => {

                isUserEditing =
                    true;

                syncHeightOnly();
            }
        );


        span.addEventListener(
            "blur",
            () => {

                isUserEditing =
                    false;

                syncWithStreamlit();
            }
        );


        return span;
    }


    /* =========================================================
       PARSE EDITOR CONTENT
       ========================================================= */

    function parseTokens(
        rawText
    ) {

        /*
         * Supports:
         *
         * $x^2$
         *
         * $$x^2$$
         */

        return rawText.split(
            /(\$\$[\s\S]*?\$\$|\$[\s\S]*?\$)/g
        );
    }


    /* =========================================================
       BUILD EDITOR
       ========================================================= */

    function buildEditor(
        rawText
    ) {

        const container =
            document.getElementById(
                "editor"
            );


        if (!container) {
            return;
        }


        /*
         * Don't rebuild while the user is actively typing.
         */

        if (
            isUserEditing &&
            rawText !== currentText
        ) {

            return;
        }


        /*
         * Store the value BEFORE rendering.
         */

        currentText =
            rawText || "";


        /*
         * Remove only the editor's current children.
         *
         * The modal MathLive field lives OUTSIDE this
         * container and therefore remains untouched.
         */

        while (
            container.firstChild
        ) {

            container.removeChild(
                container.firstChild
            );
        }


        const tokens =
            parseTokens(
                currentText
            );


        let hasContent = false;


        tokens.forEach(
            (token) => {

                if (!token) {
                    return;
                }


                hasContent = true;


                const isDisplayMath =
                    token.startsWith("$$") &&
                    token.endsWith("$$");


                const isInlineMath =
                    token.startsWith("$") &&
                    token.endsWith("$");


                if (
                    isDisplayMath ||
                    isInlineMath
                ) {

                    /*
                     * Both existing formats are preserved.
                     *
                     * $$...$$ is currently stored back as
                     * $...$ because your original data model
                     * uses $ delimiters in getFullText().
                     */

                    const latex =
                        isDisplayMath
                            ? token.slice(
                                2,
                                -2
                            )
                            : token.slice(
                                1,
                                -1
                            );


                    const mf =
                        createInlineMathfield(
                            latex
                        );


                    container.appendChild(
                        mf
                    );

                } else {

                    container.appendChild(
                        createTextNode(
                            token
                        )
                    );
                }
            }
        );


        /*
         * Empty editor still needs an editable target.
         */

        if (!hasContent) {

            container.appendChild(
                createTextNode("")
            );
        }


        syncHeightOnly();
    }


    /* =========================================================
       PASTE HANDLING
       ========================================================= */

    const container =
        document.getElementById(
            "editor"
        );


    if (container) {

        container.addEventListener(
            "paste",
            (event) => {

                /*
                 * Only intercept paste when the target is the
                 * editor itself / text area.
                 *
                 * Do not interfere with MathLive.
                 */

                const target =
                    event.target;


                if (
                    target &&
                    target.closest &&
                    target.closest(
                        "math-field"
                    )
                ) {

                    return;
                }


                event.preventDefault();


                const pastedText =
                    (
                        event.clipboardData ||
                        window.clipboardData
                    )
                        .getData(
                            "text/plain"
                        );


                const selection =
                    window.getSelection();


                if (
                    selection &&
                    selection.rangeCount
                ) {

                    const range =
                        selection.getRangeAt(
                            0
                        );


                    /*
                     * Make sure the selection belongs to
                     * the editor.
                     */

                    if (
                        container.contains(
                            range.commonAncestorContainer
                        )
                    ) {

                        range.deleteContents();


                        const textNode =
                            document.createTextNode(
                                pastedText
                            );


                        range.insertNode(
                            textNode
                        );


                        range.setStartAfter(
                            textNode
                        );

                        range.collapse(
                            true
                        );

                    } else {

                        container.appendChild(
                            document.createTextNode(
                                pastedText
                            )
                        );
                    }

                } else {

                    container.appendChild(
                        document.createTextNode(
                            pastedText
                        )
                    );
                }


                isUserEditing =
                    false;


                currentText =
                    getFullText();


                buildEditor(
                    currentText
                );


                syncWithStreamlit();
            }
        );
    }


    /* =========================================================
       STREAMLIT RENDER
       ========================================================= */

    function onRender(event) {

        try {

            const args =
                event?.detail?.args ||
                event?.data?.args;


            if (!args) {
                return;
            }


            if (
                args.height_mode !==
                undefined
            ) {

                currentHeightMode =
                    args.height_mode;
            }


            /*
             * IMPORTANT:
             *
             * Don't rebuild the editor while a MathLive modal
             * is open or while the user is editing.
             */

            const modalOpen =
                modal.classList.contains(
                    "open"
                );


            if (
                args.text !== undefined &&
                !isUserEditing &&
                !modalOpen &&
                args.text !== currentText
            ) {

                currentText =
                    args.text || "";


                buildEditor(
                    currentText
                );
            }


            syncHeightOnly();

        } catch (error) {

            console.error(
                "MathBank render error:",
                error
            );
        }
    }


    /* =========================================================
       INITIALIZATION
       ========================================================= */

    async function initialize() {

        /*
         * Wait until MathLive has registered <math-field>.
         */

        const ready =
            await waitForMathLive();


        if (!ready) {
            return;
        }


        /*
         * Configure the static MathLive elements.
         */

        configureMathfield(
            modalMf,
            {
                readOnly: false,
                keyboardPolicy: "sandboxed"
            }
        );


        configureMathfield(
            prevMf,
            {
                readOnly: true,
                keyboardPolicy: "manual"
            }
        );


        /*
         * Configure MathLive's iframe-aware keyboard.
         */

        configureVirtualKeyboard();


        /*
         * Streamlit events.
         */

        if (window.Streamlit) {

            Streamlit.events.addEventListener(
                Streamlit.RENDER_EVENT,
                onRender
            );

            Streamlit.setComponentReady();

        } else {

            sendToStreamlit(
                "streamlit:componentReady",
                {
                    apiVersion: 1
                }
            );
        }


        editorInitialized =
            true;


        syncHeightOnly();
    }


    /* =========================================================
       STREAMLIT MESSAGE FALLBACK
       ========================================================= */

    window.addEventListener(
        "message",
        (event) => {

            if (
                event.data &&
                event.data.type ===
                "streamlit:render"
            ) {

                onRender(event);
            }
        }
    );


    /* =========================================================
       WINDOW LOAD
       ========================================================= */

    window.addEventListener(
        "load",
        () => {

            initialize();
        }
    );


    /*
     * In case the page is already loaded when this script runs.
     */

    if (
        document.readyState ===
        "complete"
    ) {

        initialize();
    }

</script>
